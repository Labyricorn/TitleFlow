<div class="rotating-perspective-container">
  <button data-tf-fire="show" data-tf-label="Show" style="display:none"></button>
  <button data-tf-fire="hide" data-tf-label="Hide" style="display:none"></button>
  
  <div class="rotating-perspective-wrapper">
    <div class="rotating-perspective-inner">
      <div class="rotating-perspective-background"></div>
      <div class="rotating-perspective-content">
        <div class="rotating-perspective-badge" data-tf-bind="badge" data-tf-label="Badge">
          EXCLUSIVE COVERAGE
        </div>
        <h2 class="rotating-perspective-headline" data-tf-bind="headline" data-tf-label="Headline">
          Transformative Industry Insights: Comprehensive Analysis of Emerging Technological Paradigms
        </h2>
        <div class="rotating-perspective-accent-line"></div>
      </div>
    </div>
  </div>
</div>
