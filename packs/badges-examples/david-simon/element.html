<button data-tf-fire="show" data-tf-label="Show" style="display:none"></button>
<button data-tf-fire="hide" data-tf-label="Hide" style="display:none"></button>
<button data-tf-fire="flash" data-tf-label="Flash" style="display:none"></button>
<button data-tf-fire="pulse" data-tf-label="Pulse" style="display:none"></button>

<div class="david-simon">
  <div class="david-simon__bar"></div>
  <div class="david-simon__content">
    <span class="david-simon__name" data-tf-bind="displayName" data-tf-label="Name">DAVID SIMON</span>
    <span class="david-simon__title" data-tf-bind="subtitle" data-tf-label="Title">Producer</span>
  </div>
</div>
