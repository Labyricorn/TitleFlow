<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fjalla+One">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lettering.js/0.7.0/jquery.lettering.min.js"></script>

<button data-tf-fire="show" data-tf-label="Show Title" style="display:none"></button>
<button data-tf-fire="hide" data-tf-label="Hide Title" style="display:none"></button>

<div class="stagger-title">
  <h1>
    <span class="stagger-title__line"
          data-tf-bind="line1"
          data-tf-label="Line 1">This is</span>
    <span class="stagger-title__line"
          data-tf-bind="line2"
          data-tf-label="Line 2">a long</span>
    <span class="stagger-title__line"
          data-tf-bind="line3"
          data-tf-label="Line 3">long title</span>
  </h1>
</div>
