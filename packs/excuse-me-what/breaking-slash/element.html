<button data-tf-fire="show" data-tf-label="Show" style="display:none"></button>
<button data-tf-fire="hide" data-tf-label="Hide" style="display:none"></button>

<div class="bs-group">
  <div class="bs-red-slash"></div>
  <div class="bs-yellow-accent"></div>
  <div class="bs-corner-badge-bg"></div>
  <p class="bs-breaking-label">BREAKING NEWS</p>
  <p class="bs-badge-text" data-tf-bind="badge" data-tf-label="Badge">BREAKING</p>
  <h2 class="bs-headline" data-tf-bind="headline" data-tf-label="Headline">Breaking News</h2>
  <p class="bs-subline" data-tf-bind="subline" data-tf-label="Subline">Details to follow</p>
</div>
