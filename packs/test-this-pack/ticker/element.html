<button data-tf-fire="show" data-tf-label="Show" style="display:none"></button>
<button data-tf-fire="hide" data-tf-label="Hide" style="display:none"></button>

<div class="tk-bar">
  <div class="tk-label-badge">
    <span class="tk-label" data-tf-bind="label" data-tf-label="Label">NOW</span>
  </div>
  <div class="tk-track">
    <div class="tk-scroll">
      <span class="tk-items" data-tf-bind="items" data-tf-label="Ticker Items">Ticker text goes here — add your news items separated by  ◆ </span>
      <span class="tk-items tk-items--dupe" aria-hidden="true">Ticker text goes here — add your news items separated by  ◆ </span>
    </div>
  </div>
</div>
