<button data-tf-fire="show" data-tf-label="Start Ticker" style="display:none"></button>
<button data-tf-fire="hide" data-tf-label="Stop Ticker" style="display:none"></button>
<div class="ticker">
  <div class="ticker__label"
       data-tf-bind="label"
       data-tf-label="Label">BREAKING</div>
  <div class="ticker__track">
    <span class="ticker__text"
          data-tf-bind="text"
          data-tf-label="Ticker Text">Breaking news: this is sample ticker text that scrolls continuously across the bottom of the screen.</span>
  </div>
</div>
